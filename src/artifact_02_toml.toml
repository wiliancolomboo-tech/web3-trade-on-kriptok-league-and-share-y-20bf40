[package]
name = "kriptok_league"
version = "0.1.0"
description = "High-performance round-based trading league protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kriptok_league"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
solana-program = "=1.18.26"
pyth-sdk-solana = "0.10.1"
thiserror = "1.0.64"