[package]
name = "kriptok-league"
version = "0.1.0"
description = "High-velocity round trading protocol for KriptoK League"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kriptok_league"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
pyth-sdk-solana = "0.10.3"